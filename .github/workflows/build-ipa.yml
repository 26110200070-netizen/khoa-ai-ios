name: Build Khoa.AI iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          swift --version

      - name: Build Archive (Unsigned)
        run: |
          set -o pipefail
          xcodebuild -project KhoaAI.xcodeproj \
            -scheme KhoaAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KhoaAI.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA for ESign
        run: |
          mkdir -p Payload
          cp -r build/KhoaAI.xcarchive/Products/Applications/KhoaAI.app Payload/
          zip -r -y khoa_ai.ipa Payload
          ls -lh khoa_ai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khoa_ai_unsigned_ipa
          path: khoa_ai.ipa
          retention-days: 30

      - name: Create GitHub Release with direct IPA download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.7
          name: "khoa.ai iOS v1.0.7 (Unsigned IPA)"
          body: |
            ### 🚀 khoa.ai v1.0.7 - Bảng Markdown ChatGPT Chuẩn 100%, Sửa lỗi FINISHED & Học dữ liệu dulieukhoaai
            Được sáng lập và phát triển bởi **Khoa Dev**.

            #### ✨ Các cải tiến nổi bật trong phiên bản 1.0.7:
            1. 📊 **Thiết kế Bảng Markdown Chuẩn 100% ChatGPT (Ảnh 2)**:
               - Loại bỏ hoàn toàn khung hộp bao bọc và thanh công cụ "Bảng" rườm rà.
               - Bỏ các đường kẻ dọc ngăn cách cột thô cứng; chỉ sử dụng các đường phân cách ngang thanh mảnh, mềm mại giữa các hàng.
               - Lọc sạch toàn bộ ký tự `** **` thô trong các ô bảng, giúp chữ hiển thị tự nhiên, ngay ngắn, thoáng đãng.
            2. ⚡ **Sửa triệt để lỗi hiện chữ 'FINISHED' cuối câu trả lời**:
               - Khắc phục lỗi rò rỉ token trạng thái fragment SSE (`response/status`) từ máy chủ DeepSeek vào nội dung tin nhắn người dùng.
            3. 💬 **Chào hỏi tự nhiên, không tự giới thiệu tên thừa thãi**:
               - Khi người dùng chào hỏi bình thường ("Chào bạn", "Xin chào", "Hello"), AI chào lại thân thiện, ấm áp và ngắn gọn như ChatGPT.
               - Chỉ khi người dùng chủ động hỏi "Bạn là ai?" hoặc "Ai tạo ra bạn?", AI mới khẳng định danh tính là khoa.ai do Khoa Dev tạo ra.
            4. 🧠 **Học quy chuẩn từ dulieukhoaai.md & phong cách ChatGPT**:
               - Không lạm dụng gạch đầu dòng (-); diễn đạt bằng các đoạn văn tự nhiên, mạch lạc, kết nối ý tưởng mượt mà.
               - Trình bày Markdown rõ ràng, chuyên nghiệp; trả lời thẳng vào trọng tâm yêu cầu.

            #### ✨ Các cải tiến và sửa lỗi trong phiên bản 1.0.4:
            1. 🌐 **Web Search luôn bật mặc định**, Suy nghĩ (DeepThink) mặc định là `false`.
            2. ✉️ **Chuyển đổi nút nhập liệu**:
               - Khi người dùng nhập tin nhắn hoặc đính kèm ảnh/tệp, icon mic/loa kế bên icon `(+)` tự động biến đổi mượt mà thành icon Gửi `(↑)`.
               - Bỏ hoàn toàn dấu `(X)` trên thanh nhập liệu.
            3. ⬇️ **Nút mũi tên cuộn xuống thông minh**: Chỉ hiển thị khi người dùng cuộn lên trên xem lại tin nhắn; khi cuộn xuống tới đáy thì lập tức tự động ẩn.
            4. ⚡ **Khắc phục triệt để lỗi mất ký tự đầu tiên**: Xử lý toàn diện mọi định dạng chunk SSE và snapshot payload từ DeepSeek mà không bỏ sót bất kỳ ký tự nào.
            5. 🪟 **Khung nền thanh nhập liệu trong suốt tuyệt đối 100%**: Loại bỏ hoàn toàn mảng nền trắng/mờ, mang lại vẻ đẹp Liquid Glass tối giản, tinh khiết.
            6. 🎛️ **Nút chọn Model và Menu trong suốt 100%**: Không còn khung bao bọc / capsule thừa, icon hai gạch và nhãn Model hiển thị liền mạch với giao diện.
            7. 📖 **Giãn dòng hiển thị văn bản AI thoáng đãng**: Tăng độ giãn dòng chuẩn `lineSpacing(6.5)` và khoảng cách đoạn văn thoáng mát như các AI hiện đại, không còn bị dính sát vào nhau.
            8. 📜 **Giao diện Lịch sử trò chuyện chuẩn 100% Ảnh 1**:
               - Thanh tìm kiếm dạng Capsule bo tròn mềm mại `"Tìm kiếm nội dung trò chu..."`.
               - Tiêu đề mục `"Hôm nay"` kèm biểu tượng bộ lọc `slider.horizontal.2`.
               - Thẻ trò chuyện bo góc mềm mại màu xanh nhạt `[ Chào hỏi   ••• ]`.
               - Thanh hồ sơ đáy với avatar tím tròn `[A] Alo khoa   •••`.
            9. 📊 **Render bảng biểu Markdown chuẩn 100% Ảnh 2**:
               - Thẻ bảng trắng viền mảnh sắc nét, thanh công cụ đầu bảng `[ Bảng   􀉁  􀈂  􀅊 ]` (sao chép bảng, tải xuống, mở rộng).
               - Cột đầu tiên (`Ngày`: Thứ 2, Thứ 3...) được in đậm rõ ràng, các cột còn lại hiển thị chữ chuẩn, lưới bảng mỏng và hỗ trợ cuộn ngang linh hoạt.
            10. 🧠 **Học dữ liệu quy chuẩn từ dulieukhoaai.md**: Tiếp thu kiến thức chuẩn mực về văn phong, cách trình bày, sự thông tuệ, văn minh và an toàn; luôn kiên định với danh tính là **khoa.ai** do **Khoa Dev** sáng tạo và phát triển.

            #### 📱 Hướng dẫn cài đặt qua ESign:
            1. Tải file `khoa_ai.ipa` đính kèm bên dưới về iPhone.
            2. Mở ứng dụng **ESign** trên máy.
            3. Chọn file `khoa_ai.ipa`, chọn chứng chỉ ký của bạn và nhấn **Sign & Install**.
          files: khoa_ai.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
