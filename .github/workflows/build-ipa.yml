name: Build Khoa.AI iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          swift --version

      - name: Build Archive (Unsigned)
        run: |
          set -o pipefail
          xcodebuild -project KhoaAI.xcodeproj \
            -scheme KhoaAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KhoaAI.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA for ESign
        run: |
          mkdir -p Payload
          cp -r build/KhoaAI.xcarchive/Products/Applications/KhoaAI.app Payload/
          zip -r -y khoa_ai.ipa Payload
          ls -lh khoa_ai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khoa_ai_unsigned_ipa
          path: khoa_ai.ipa
          retention-days: 30

      - name: Create GitHub Release with direct IPA download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.1
          name: "khoa.ai iOS v1.0.1 (Unsigned IPA)"
          body: |
            ### 🏜️ khoa.ai v1.0.1 - Cập nhật Light UI & Khắc phục kết nối DeepSeek
            Được phát triển bởi **Khoa Dev**.
            
            - ☀️ **Giao diện chuẩn Light UI**: Trắng sáng tinh khôi, hiệu ứng Liquid Glass kính nổi sắc nét, đúng chuẩn ảnh mẫu.
            - ⬇️ **Tự động hạ thanh nhập liệu**: Chạm vào bất kỳ điểm nào trên màn hình hoặc cuộn tin nhắn để ẩn bàn phím và hạ thanh nhập liệu xuống mượt mà.
            - ⚡ **Khắc phục kết nối & Sẵn sàng Chat**:
              - Nhúng trực tiếp bộ giải WebAssembly `DeepSeekHashV1` vào cây hiển thị cửa sổ, không bao giờ bị treo hay chờ đợi.
              - Tự động nạp sẵn phiên DeepSeek mẫu đã vượt AWS WAF để có thể chat ngay lập tức sau khi cài đặt.
              - Hỗ trợ thêm tab "Nạp phiên / Token thủ công" và sửa lỗi cửa sổ popup Google OAuth.
              - Báo cáo trạng thái theo thời gian thực (Đang kết nối, Đang giải PoW, Đang sinh câu trả lời).
            
            #### 📱 Hướng dẫn cài đặt qua ESign:
            1. Tải file `khoa_ai.ipa` đính kèm bên dưới về iPhone.
            2. Mở ứng dụng **ESign** trên máy.
            3. Chọn file `khoa_ai.ipa`, chọn chứng chỉ ký của bạn và nhấn **Sign & Install**.
          files: khoa_ai.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
