name: Build Khoa.AI iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          swift --version

      - name: Build Archive (Unsigned)
        run: |
          set -o pipefail
          xcodebuild -project KhoaAI.xcodeproj \
            -scheme KhoaAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KhoaAI.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA for ESign
        run: |
          mkdir -p Payload
          cp -r build/KhoaAI.xcarchive/Products/Applications/KhoaAI.app Payload/
          zip -r -y khoa_ai.ipa Payload
          ls -lh khoa_ai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khoa_ai_unsigned_ipa
          path: khoa_ai.ipa
          retention-days: 30

      - name: Create GitHub Release with direct IPA download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.3
          name: "khoa.ai iOS v1.0.3 (Unsigned IPA)"
          body: |
            ### 🚀 khoa.ai v1.0.3 - Markdown toàn diện, Thẻ gợi ý ảnh, Hiệu ứng suy nghĩ Video & Sửa lỗi che giao diện
            Được phát triển bởi **Khoa Dev**.
            
            - 📑 **Hỗ trợ Markdown toàn diện**:
              - Tiêu đề (# ## ###), in đậm, in nghiêng, trích dẫn.
              - Kẻ bảng biểu (Tables) tự động căn chỉnh khung sắc nét.
              - Khối code (Code Blocks) dạng thẻ trắng có nút **Sao chép**, chữ code nhỏ gọn dễ nhìn, font chữ mặc định của AI được tăng lên 17pt cho trải nghiệm đọc tối ưu.
            - 🖼️ **Giao diện đính kèm ảnh & Gợi ý câu hỏi (Chuẩn Ảnh 2 & 3)**:
              - Hiển thị thumbnail ảnh xem trước trong khung nhập liệu kèm nút `✕` xóa ảnh.
              - 3 chip gợi ý nhanh: **[Đây là gì →]**, **[Phân tích →]**, **[Đề xuất giải pháp →]**. Khi người dùng gõ tin nhắn thì gợi ý tự động ẩn đi.
              - Khi gửi, ảnh hiển thị góc phải trên tin nhắn người dùng và AI phân tích chi tiết hình ảnh thông qua Apple Vision OCR & Object/Scene Classification.
            - 💡 **Hiệu ứng AI suy nghĩ & Nút dừng (Chuẩn Video)**:
              - 3 chấm nảy chuyển động `• • •` khi AI đang kết nối/suy nghĩ.
              - Khung suy nghĩ thu phóng `Suy nghĩ ᨈ` kèm vạch kẻ xám tinh tế.
              - Nút tròn xanh dừng tạo câu trả lời (Stop) hình vuông trắng ở góc phải thanh nhập liệu khi AI đang sinh văn bản.
            - ⬇️ **Nút mũi tên cuộn xuống (Chuẩn Ảnh 4)**:
              - Tự động hiện icon mũi tên tròn `( ∨ )` khi người dùng cuộn lên đọc tin nhắn cũ.
              - Không tự động cuộn giật màn hình khi AI đang chat, cho phép người dùng thoải mái đọc tin nhắn phía trên.
            - 🛡️ **Sửa lỗi thanh lịch sử bị che tai thỏ (Chuẩn Ảnh 1)**:
              - Tối ưu khoảng đệm Safe Area trên Dynamic Island / Notch, ô tìm kiếm và các thẻ trò chuyện hiển thị rõ ràng, không bị che khuất.
            - 🌐 **Web search mặc định luôn bật** cho mọi câu hỏi.
            - ✨ **Giao diện khởi đầu tối giản**: Bỏ logo, chỉ hiển thị dòng chữ chào thanh lịch.
            
            #### 📱 Hướng dẫn cài đặt qua ESign:
            1. Tải file `khoa_ai.ipa` đính kèm bên dưới về iPhone.
            2. Mở ứng dụng **ESign** trên máy.
            3. Chọn file `khoa_ai.ipa`, chọn chứng chỉ ký của bạn và nhấn **Sign & Install**.
          files: khoa_ai.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
