name: Build Khoa.AI iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          swift --version

      - name: Build Archive (Unsigned)
        run: |
          set -o pipefail
          xcodebuild -project KhoaAI.xcodeproj \
            -scheme KhoaAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KhoaAI.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA for ESign
        run: |
          mkdir -p Payload
          cp -r build/KhoaAI.xcarchive/Products/Applications/KhoaAI.app Payload/
          zip -r -y khoa_ai.ipa Payload
          ls -lh khoa_ai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khoa_ai_unsigned_ipa
          path: khoa_ai.ipa
          retention-days: 30

      - name: Create GitHub Release with direct IPA download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.2
          name: "khoa.ai iOS v1.0.2 (Unsigned IPA)"
          body: |
            ### 🧠 khoa.ai v1.0.2 - Logo Dây thần kinh AI, Lịch sử Chat vuốt chạm, Model Selector & Đính kèm đa phương tiện
            Được phát triển bởi **Khoa Dev**.
            
            - 🧠 **Logo Dây thần kinh mới (Neural Network & Synapses)**: Thiết kế mạng lưới nơ-ron và khớp thần kinh phát sáng công nghệ cao, cập nhật toàn diện AppIcon và biểu tượng khoa.ai.
            - 🔀 **Chọn Model ngay cạnh icon 2 gạch**: Mặc định là **DeepSeek-R1 (Expert)**, hỗ trợ chuyển đổi nhanh sang DeepSeek-V3 (Standard).
            - 📜 **Lịch sử cuộc trò chuyện chuẩn Video**:
              - Bấm vào icon 2 gạch hoặc **dùng ngón tay vuốt từ mép trái sang phải** để kéo mượt mà menu lịch sử chat.
              - Tìm kiếm nội dung chat theo từ khóa, chuyển đổi qua lại giữa các phiên và tạo đoạn hội thoại mới.
            - 📎 **Menu đính kèm (+) dạng 3 thẻ Liquid Glass**:
              - Bấm dấu `+` chuyển thành `✕` mở ra 3 thẻ: **[Chụp ảnh]**, **[Album]**, **[Tệp]**.
              - Tích hợp công nghệ nhận diện chữ Apple Neural Vision OCR và trích xuất PDF/Text trực tiếp trên máy, giúp AI đọc hiểu toàn bộ tài liệu và ảnh.
            - 🛠️ **Sửa lỗi ký tự đầu tiên**: Xử lý triệt để lỗi SSE snapshot khiến AI bị nuốt mất ký tự đầu tiên (ví dụ "ình" thành "Mình").
            - 🎨 **Tinh chỉnh giao diện**:
              - Bỏ chấm xanh bên dưới "Tôi có thể giúp gì cho bạn?".
              - Nút "Tìm kiếm" (Web search) chuyển sang chỉ hiển thị Icon địa cầu tinh gọn.
              - Nút "Suy nghĩ" giữ nguyên kích thước không còn bị co lại.
            
            #### 📱 Hướng dẫn cài đặt qua ESign:
            1. Tải file `khoa_ai.ipa` đính kèm bên dưới về iPhone.
            2. Mở ứng dụng **ESign** trên máy.
            3. Chọn file `khoa_ai.ipa`, chọn chứng chỉ ký của bạn và nhấn **Sign & Install**.
          files: khoa_ai.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
